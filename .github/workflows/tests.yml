name: Tests and repository validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python tools/check_ha_api.py
      - run: python tools/check_prompt_compatibility.py
      - run: python tools/generate_prompt_contracts.py
      - name: Never silently change audited contracts
        run: git diff --exit-code -- custom_components/assist_router/prompt_contracts.json docs/ha_api_evidence.json docs/prompt_compatibility_evidence.json reference/
      - run: python -m pytest tests -q
      - run: ruff check custom_components tests tests_live tools
      - run: ruff format --check custom_components tests tests_live tools
      - run: python tools/check_repository.py --tag v1.2.1
      - run: python tools/build_release.py
  actual-home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'homeassistant==2026.10.2' pytest pytest-asyncio
      - name: Require actual HA (no import skip as success)
        run: python -c "from homeassistant.core import HomeAssistant; from homeassistant.components import conversation"
      - run: python -m pytest tests_live -q
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
